name: PR Check

on:
  pull_request:

jobs:
  call-repo-b:
    uses: hemanth-vurimi/DevSecOps/.github/workflows/test.yaml@main

  validate-stage:
    runs-on: ubuntu-latest
    needs: call-repo-b
    steps:
      - name: Validate Stage
        run: |
          RESULT="${{ needs.call-repo-b.outputs.stage_result }}"
          echo "Stage result: $RESULT"

          if [ "$RESULT" != "success" ]; then
            echo "Stage failed → failing PR"
            exit 1
          else
            echo "Stage passed"
          fi
