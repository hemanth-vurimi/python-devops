name: PR Check via Repo B 

on:
  pull_request:

jobs:
  trigger-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Repo B Workflow
        run: |
          echo "Triggering Repo B workflow..."
          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/hemanth-vurimi/DevSecOps/dispatches \
            -d '{"event_type":"run-test"}')
          echo "HTTP Status: $RESPONSE"
          cat response.txt

      - name: Wait for test-stage result (max 2 mins)
        run: |
          echo "Waiting for test-stage job..."

          REPO="hemanth-vurimi/DevSecOps"

          START_TIME=$(date +%s)
          TIMEOUT=120   # 2 minutes

          while true; do

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            echo "Elapsed time: ${ELAPSED}s"

            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout reached (2 minutes)"
              exit 1
            fi

            # Get latest workflow run ID
            RUN_ID=$(curl -s \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              https://api.github.com/repos/$REPO/actions/runs \
              | jq -r '.workflow_runs[0].id')

            if [ "$RUN_ID" == "null" ] || [ -z "$RUN_ID" ]; then
              echo "No runs found yet..."
              sleep 5
              continue
            fi

            echo "Run ID: $RUN_ID"

            # Get test-stage job status
            JOB_STATUS=$(curl -s \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs \
              | jq -r '.jobs[] | select(.name=="test-stage") | .conclusion')

            echo "Test-stage status: $JOB_STATUS"

            if [ "$JOB_STATUS" == "success" ]; then
              echo "✅ Test-stage passed"
              exit 0
            elif [ "$JOB_STATUS" == "failure" ]; then
              echo "❌ Test-stage failed"
              exit 1
            fi

            echo "Still running... waiting 10s..."
            sleep 10
          done
